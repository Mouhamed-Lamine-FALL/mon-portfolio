<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Détail projet — Mouhamed Lamine FALL</title>
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#EDF0F2;
    --paper-deep:#E2E7EA;
    --line:#C3CCD3;
    --line-strong:#8C99A3;
    --ink:#12203A;
    --ink-soft:#4C5A70;
    --blueprint:#0A3D62;
    --accent:#D6541F;
    --surface:#FFFFFF;
    --sans:"IBM Plex Sans", system-ui, sans-serif;
    --cond:"IBM Plex Sans Condensed", var(--sans);
    --mono:"IBM Plex Mono", monospace;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--sans);font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--cond);font-weight:700;color:var(--ink);margin:0;letter-spacing:-0.01em;}
  a{color:inherit;}
  img,video{max-width:100%;display:block;}
  .mono{font-family:var(--mono);}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}

  .sheet{max-width:1180px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line);position:relative;background:var(--paper);}
  .corner{position:absolute;width:18px;height:18px;pointer-events:none;}
  .corner::before,.corner::after{content:"";position:absolute;background:var(--line-strong);}
  .corner::before{width:100%;height:1px;top:0;left:0;}
  .corner::after{width:1px;height:100%;top:0;left:0;}
  .corner.tl{top:0;left:0;}
  .corner.tr{top:0;right:0;transform:scaleX(-1);}

  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 32px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:rgba(237,240,242,0.92);backdrop-filter:blur(6px);z-index:50;
  }
  .monogram{width:38px;height:38px;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--cond);font-weight:700;font-size:0.85rem;flex-shrink:0;}
  nav ul{list-style:none;display:flex;gap:28px;margin:0;padding:0;}
  nav a{text-decoration:none;font-size:0.94rem;color:var(--ink-soft);border-bottom:1px solid transparent;padding-bottom:2px;transition:color .15s,border-color .15s;}
  nav a:hover{color:var(--accent);border-color:var(--accent);}
  .nav-toggle{display:none;background:none;border:1px solid var(--ink);width:38px;height:38px;font-size:1.1rem;cursor:pointer;}
  @media (max-width:820px){
    nav ul{position:fixed;top:78px;left:0;right:0;flex-direction:column;background:var(--surface);border-bottom:1px solid var(--line);padding:18px 32px;gap:16px;transform:translateY(-8px);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;}
    nav ul.open{opacity:1;transform:translateY(0);pointer-events:auto;}
    .nav-toggle{display:block;}
  }

  section{padding:64px 32px;position:relative;}
  .folio{position:absolute;top:24px;right:32px;font-family:var(--mono);font-size:0.72rem;color:var(--line-strong);letter-spacing:0.02em;}
  .breadcrumb{font-family:var(--mono);font-size:0.8rem;color:var(--ink-soft);margin-bottom:18px;}
  .breadcrumb a{color:var(--ink-soft);text-decoration:none;}
  .breadcrumb a:hover{color:var(--accent);}
  .kicker{font-family:var(--mono);font-size:0.78rem;color:var(--accent);margin-bottom:10px;display:block;}
  h1.title{font-size:clamp(1.7rem,3.4vw,2.5rem);max-width:760px;}

  /* gallery */
  .gallery{margin-top:40px;border:1px solid var(--line-strong);background:var(--surface);}
  .gallery-main{aspect-ratio:16/9;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;}
  .gallery-main img,.gallery-main video{width:100%;height:100%;object-fit:contain;background:#0d1520;}
  .gallery-thumbs{display:flex;border-top:1px solid var(--line);}
  .gallery-thumbs button{
    flex:1;border:none;border-right:1px solid var(--line);background:var(--paper-deep);
    font-family:var(--mono);font-size:0.76rem;color:var(--ink-soft);
    padding:10px 6px;cursor:pointer;transition:background .15s,color .15s;
  }
  .gallery-thumbs button:last-child{border-right:none;}
  .gallery-thumbs button.active,.gallery-thumbs button:hover{background:var(--ink);color:var(--paper);}

  /* detail grid */
  .detail-grid{display:grid;grid-template-columns:1fr 300px;gap:56px;margin-top:44px;align-items:start;}
  @media (max-width:860px){.detail-grid{grid-template-columns:1fr;}}
  .description p{color:var(--ink-soft);margin:0 0 16px;font-size:1rem;}
  .description strong{color:var(--ink);}

  .infoblock{border:1px solid var(--line-strong);font-family:var(--mono);font-size:0.86rem;}
  .infoblock-row{display:grid;grid-template-columns:110px 1fr;border-top:1px solid var(--line-strong);}
  .infoblock-row:first-child{border-top:none;}
  .infoblock-row span{padding:12px 14px;}
  .infoblock-row .field{color:var(--ink-soft);border-right:1px solid var(--line-strong);background:var(--paper-deep);}
  .infoblock-row .value{color:var(--ink);}

  .btn{
    font-family:var(--sans);font-weight:600;font-size:0.92rem;padding:12px 22px;
    border:1.5px solid var(--ink);color:var(--ink);text-decoration:none;
    display:inline-flex;align-items:center;gap:8px;margin-top:26px;
    transition:background .15s,color .15s;
  }
  .btn:hover{background:var(--ink);color:var(--paper);}

  footer{
    padding:36px 32px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;
    font-size:0.86rem;color:var(--ink-soft);
  }
  footer .social{display:flex;gap:16px;}
  footer a{text-decoration:none;color:var(--ink-soft);}
  footer a:hover{color:var(--accent);}

  .not-found{color:var(--ink-soft);margin-top:24px;}
</style>
</head>
<body>

<div class="sheet">
  <span class="corner tl"></span>
  <span class="corner tr"></span>

  <header>
    <a href="index.html#hero" style="text-decoration:none;display:flex;align-items:center;gap:14px;">
      <div class="monogram">MLF</div>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Ouvrir le menu">☰</button>
    <nav>
      <ul id="navList">
        <li><a href="index.html#about">Profil</a></li>
        <li><a href="index.html#skills">Compétences</a></li>
        <li><a href="index.html#parcours">Parcours</a></li>
        <li><a href="index.html#projets">Projets</a></li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section id="project-section">
    <span class="folio">FICHE PROJET</span>
    <div class="breadcrumb"><a href="index.html">Accueil</a> / <a href="index.html#projets">Projets</a> / <span id="bc-current">Détail</span></div>
    <span class="kicker" id="p-cat">Projet</span>
    <h1 class="title" id="p-title">Chargement…</h1>

    <div class="gallery" id="p-gallery" style="display:none;">
      <div class="gallery-main" id="p-gallery-main"></div>
      <div class="gallery-thumbs" id="p-gallery-thumbs"></div>
    </div>

    <div class="detail-grid">
      <div class="description" id="p-description"></div>
      <div>
        <div class="infoblock">
          <div class="infoblock-row"><span class="field">Catégorie</span><span class="value" id="p-info-cat"></span></div>
          <div class="infoblock-row"><span class="field">Date</span><span class="value" id="p-info-date"></span></div>
        </div>
        <a href="index.html#projets" class="btn">← Retour aux projets</a>
      </div>
    </div>

    <p class="not-found" id="p-notfound" style="display:none;">Projet introuvable — retourne à la liste des projets depuis l'accueil.</p>
  </section>

  <footer>
    <span>© 2026 Mouhamed Lamine FALL</span>
    <div class="social">
      <a href="https://www.linkedin.com/in/mouhamed-lamine-fall-mon-profil/">LinkedIn</a>
      <a href="https://x.com/fall_mouha17562?s=21">X</a>
      <a href="https://www.instagram.com/everyonehates.lamine?igsh=MTAxNXkyYnNpb2pwMA%3D%3D&utm_source=qr">Instagram</a>
    </div>
  </footer>
</div>

<script>
  const navToggle = document.getElementById('navToggle');
  const navList = document.getElementById('navList');
  navToggle.addEventListener('click', () => navList.classList.toggle('open'));

  const projects = {
    CP42: {
      title: "Modélisation dynamique d'un moteur radial à 7 cylindres",
      description: "<p>Réalisé dans le cadre de l'unité d'enseignement <strong>CP42</strong>, ce projet consiste en la conception technique complète et la simulation cinématique d'un moteur aéronautique en étoile.</p><p>Le cœur du travail a porté sur la modélisation précise d'un système <strong>bielle-manivelle complexe</strong>, articulant une bielle maîtresse et six bielles secondaires, nécessitant une gestion rigoureuse des contraintes géométriques et des liaisons mécaniques sous CAO.</p><p>Le projet inclut une analyse approfondie du cycle moteur et des mouvements alternatifs des pistons, ainsi qu'une simulation dynamique permettant de vérifier l'absence d'interférences lors de la rotation complète du vilebrequin.</p><p>L'assemblage a été optimisé pour respecter les tolérances mécaniques réelles, garantissant ainsi une synchronisation parfaite des phases d'admission et d'échappement. Cette réalisation a permis de consolider la maîtrise des outils de <strong>Conception Assistée par Ordinateur</strong>, de la théorie des mécanismes et de la gestion d'assemblages à haut degré de liberté.</p>",
      images: ["assets/img/portfolio/CP42/mouv_system.mp4", "assets/img/portfolio/CP42/vue arriere.png", "assets/img/portfolio/CP42/vue de face.png"],
      cat: "Modélisation, CAO",
      date: "Février 2025 - Mai 2025"
    },
    FLAMBEMENT: {
      title: "Analyse du flambement d'une poutre hyperstatique avec modélisation en C# et éléments finis",
      description: "<p>Dans le cadre du module MN41 (Modélisation numérique des problèmes de l'ingénieur), une étude a été menée sur le flambement d'une poutre hyperstatique. L'approche a débuté par une modélisation analytique à l'aide de la formule d'Euler, puis s'est poursuivie par une simulation numérique par éléments finis, développée en C#.</p><p>La poutre et ses conditions limites ont été modélisées, les efforts internes calculés, et les déformations analysées pour différentes valeurs de chargement critique. Cette étude a permis une comparaison rigoureuse entre les résultats analytiques et ceux issus de la simulation numérique.</p><p>Ce projet a consolidé les compétences en mécanique des structures, modélisation EF, programmation scientifique, ainsi qu'en analyse critique des résultats.</p>",
      images: ["assets/img/masonry-portfolio/flamb.png"],
      cat: "Projet d'étude",
      date: "Décembre 2024"
    },
    ROBOT: {
      title: "Robot Hexapode",
      description: "<p>Ce projet avait pour objectif de concevoir un robot hexapode capable de se déplacer de manière autonome dans des environnements hostiles. Inspiré de la locomotion des insectes, le robot est conçu pour franchir des obstacles et s'adapter à des terrains irréguliers.</p><p>Le développement a couvert l'étude cinématique, la conception des articulations et du châssis, la simulation des mouvements ainsi que la modélisation complète sous Fusion 360. Des tests de capteurs et des premières approches de pilotage automatisé ont été également explorés.</p><p>Ce projet mobilise des compétences en mécanique, robotique, modélisation 3D et algorithmique appliquée.</p>",
      images: ["assets/img/masonry-portfolio/ROBOT.jpg"],
      cat: "Projet TIPE",
      date: "Janvier 2024 - Juin 2024"
    },
    FA31: {
      title: "Optimisation topologique",
      description: "<p>Ce projet visait à reconcevoir une pièce appelée « mélangeur », utilisée dans un bain de métaux liquides à plus de 1000°C. L'objectif principal était de l'adapter à la fabrication additive en acier inox 316L, tout en intégrant un circuit de refroidissement par eau et un revêtement céramique appliqué par le client.</p><p>Initialement composée de 13 éléments soudés, la pièce a été repensée pour limiter les assemblages grâce à l'impression 3D par fusion sur lit de poudre (LPBF), en respectant les dimensions maximales de la machine (250×250×200 mm). Les contraintes géométriques, notamment celles du circuit de refroidissement, ont été rigoureusement respectées.</p><p>Les outils mobilisés incluaient Fusion 360 et Netfabb, avec un travail approfondi sur la modélisation CAO, la gestion des supports d'impression, ainsi que l'optimisation topologique.</p>",
      images: ["assets/img/masonry-portfolio/mel1.png", "assets/img/masonry-portfolio/Mel2.jpg"],
      cat: "Projet d'étude",
      date: "Novembre 2024"
    },
    ST40: {
      title: "Développement de revêtements fonctionnels par projection thermique",
      description: "<p>Ce stage de cinq mois, réalisé au sein du LERMPS (ICB – UTBM), a offert une immersion complète dans le domaine de la projection thermique appliquée au développement de matériaux poreux fonctionnels.</p><p>La première phase du travail a consisté à concevoir et usiner un dispositif permettant la projection simultanée de deux poudres à l'aide d'une torche flamme, avant de préparer et découper des substrats en acier inoxydable.</p><p>Plusieurs séries de dépôts ont ensuite été réalisées avec différents mélanges de poudres (Al₂O₃–316L puis Al₂O₃–Cu), suivies d'un important travail de découpe, d'enrobage à froid et de polissage pour les caractérisations microstructurales.</p><p>Ce stage a permis de comprendre l'influence des paramètres de projection sur la qualité et la cohésion des dépôts, dans l'objectif d'optimiser les conditions permettant d'obtenir une matrice poreuse maîtrisée. Une seconde phase, actuellement en préparation, consistera à dissoudre la phase métallique afin de dégager la porosité recherchée.</p><p>Cette expérience, mêlant expérimentation, conception mécanique et analyses microscopiques, a renforcé l'intérêt pour les procédés de fabrication avancés.</p>",
      images: ["assets/img/masonry-portfolio/exemple montage.png", "assets/img/masonry-portfolio/vid Robot.mp4", "assets/img/masonry-portfolio/vid torche.mp4"],
      cat: "Stage Assistant ingénieur",
      date: "Septembre 2025 - Février 2026"
    },
    FIMU: {
      title: "Expérience Innovation Crunch Time",
      description: "<p>Le Crunch Time UTBM est un challenge d'innovation rapide d'une semaine. L'équipe a été missionnée pour concevoir une installation décorative lumineuse, durable et modulable pour le FIMU, un festival de musique international à Belfort.</p><p>Ce projet a demandé de travailler sous pression, de prototyper rapidement, et de trouver des solutions techniques robustes et esthétiques, en respectant des contraintes réelles : résistance aux intempéries, sécurité, transportabilité et optimisation des coûts.</p><p>Cette expérience a renforcé les compétences en travail d'équipe, gestion de projet, créativité, ainsi qu'en dialogue avec les acteurs du monde professionnel.</p>",
      images: ["assets/img/masonry-portfolio/FIMU1.jpg", "assets/img/masonry-portfolio/UTBM1.jpg", "assets/img/masonry-portfolio/UTBM2.jpg"],
      cat: "Hackathon d'innovation",
      date: "Mars 2025"
    },
    JOURNEE_DECOUVERTE: {
      title: "Journée de découverte – Département Maintenance, ICS (Industries Chimiques du Sénégal)",
      description: "<p>Une immersion d'une journée au sein du département maintenance des ICS a permis de découvrir concrètement le quotidien d'un ingénieur mécanicien, d'observer le travail des chaudronniers, et d'échanger avec des professionnels passionnés.</p><p>Comprendre le fonctionnement d'une usine « de l'intérieur » a mis en lumière l'omniprésence de la mécanique dans les installations industrielles et son rôle crucial dans leur bon fonctionnement. Cette expérience a renforcé l'intérêt pour l'ingénierie et donné du sens aux études en cours.</p><p>Bien qu'elle fût brève, cette immersion a marqué un tournant en confirmant une volonté claire : s'engager pleinement dans la voie de l'ingénierie mécanique.</p>",
      images: ["assets/img/masonry-portfolio/ICS1.jpeg", "assets/img/masonry-portfolio/ICS2.jpeg", "assets/img/masonry-portfolio/ICS3.jpeg"],
      cat: "Journée découverte",
      date: "Juillet 2023"
    },
    SERVER: {
      title: "Conception d'un mini serveur",
      description: "<p>Ce projet personnel, développé sur un <strong>Raspberry Pi Zero 2 WH</strong>, consiste en la mise en place d'un serveur domestique polyvalent axé sur la cybersécurité et l'optimisation réseau.</p><p>La phase principale a porté sur le déploiement de <strong>Pi-hole</strong> sous Debian 12 (Bookworm), agissant comme un puits DNS (DNS Sinkhole) pour filtrer les publicités et les trackers au niveau du réseau local, améliorant ainsi la confidentialité et la bande passante de tous les appareils connectés.</p><p>Le projet inclut également une gestion avancée de l'alimentation via des scripts d'automatisation (Crontab) pour assurer la maintenance système, ainsi qu'une surveillance thermique constante maintenant le processeur à une température optimale de 29°C.</p><p>Parallèlement, le serveur a été configuré comme un <strong>Hub d'organisation personnel</strong>, intégrant des services de gestion de tâches et de monitoring, tout en servant de laboratoire d'expérimentation pour le protocole I2C (intégration future de capteurs météo BME280) et la gestion de tunnels distants (Apache Guacamole).</p><p>Cette réalisation technique a permis d'approfondir les compétences en administration Linux, en gestion de conteneurs et en architecture réseau, tout en apportant une solution concrète aux problématiques de protection des données privées.</p>",
      images: ["assets/img/portfolio/Simulation.png", "assets/img/portfolio/boitier int.png", "assets/img/portfolio/boitier.png"],
      cat: "Conception & Simulation",
      date: "Mars 2026"
    }
  };

  function isVideo(src){ return /\.(mp4|mov)$/i.test(src); }

  function renderMain(src){
    const main = document.getElementById('p-gallery-main');
    main.innerHTML = '';
    if(isVideo(src)){
      const v = document.createElement('video');
      v.src = src; v.controls = true; v.playsInline = true;
      main.appendChild(v);
    } else {
      const img = document.createElement('img');
      img.src = src; img.alt = '';
      main.appendChild(img);
    }
  }

  function load(){
    const hash = window.location.hash.substring(1);
    const p = projects[hash];
    if(!p){
      document.getElementById('p-notfound').style.display = 'block';
      document.getElementById('p-title').textContent = "Projet introuvable";
      return;
    }
    document.getElementById('bc-current').textContent = p.title;
    document.getElementById('p-cat').textContent = p.cat;
    document.getElementById('p-title').textContent = p.title;
    document.getElementById('p-description').innerHTML = p.description;
    document.getElementById('p-info-cat').textContent = p.cat;
    document.getElementById('p-info-date').textContent = p.date;

    const gallery = document.getElementById('p-gallery');
    const thumbs = document.getElementById('p-gallery-thumbs');
    thumbs.innerHTML = '';
    gallery.style.display = 'block';
    renderMain(p.images[0]);
    p.images.forEach((src, i) => {
      const btn = document.createElement('button');
      btn.textContent = 'PL.' + (i+1);
      if(i === 0) btn.classList.add('active');
      btn.addEventListener('click', () => {
        renderMain(src);
        thumbs.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
      thumbs.appendChild(btn);
    });
  }

  window.addEventListener('hashchange', load);
  load();
</script>
</body>
</html>
